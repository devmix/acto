name: benchmarks

on:
  workflow_dispatch:

env:
  # bump manually when a new Temurin 21 build ships
  JDK_VERSION: 21.0.13+9

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JDK
        id: jdk-cache
        uses: actions/cache@v4
        with:
          # workspace-relative: act_runner extracts cache archives relative to
          # the workspace, so absolute ~ paths never round-trip back to $HOME
          path: .jdk-cache
          key: jdk-v3-${{ env.JDK_VERSION }}-linux-x64

      - name: Download JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .jdk-cache
          curl -fsSL -o .jdk-cache/jdk.tar.gz \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-${JDK_VERSION/\+/%2B}/OpenJDK21U-jdk_x64_linux_hotspot_${JDK_VERSION//+/_}.tar.gz"

      - name: Set up JDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.jdk"
          tar -xzf "$GITHUB_WORKSPACE/.jdk-cache/jdk.tar.gz" -C "$GITHUB_WORKSPACE/.jdk" --strip-components=1 --no-same-owner
          echo "JAVA_HOME=$GITHUB_WORKSPACE/.jdk" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.jdk/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.jdk/bin/java" -version

      - name: Build benchmarks
        run: ./mvnw -ntp -Pbenchmarks -pl api,core,benchmarks clean verify

      - name: Smoke test the jar
        run: java -jar benchmarks/target/benchmarks.jar -l > /dev/null

      - name: Run benchmarks
        timeout-minutes: 30
        run: java -jar benchmarks/target/benchmarks.jar -rf json -rff baseline.json

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: baseline.json
