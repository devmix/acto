name: build

on:
  push:
    branches: [ main ]
  pull_request:

env:
  # bump manually when a new Temurin 21 build ships
  JDK_VERSION: 21.0.13+9
  # last released version, used as the japicmp binary-compatibility baseline
  JAPICMP_BASELINE: 0.2.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JDK
        id: jdk-cache
        uses: actions/cache@v4
        with:
          # workspace-relative: act_runner extracts cache archives relative to
          # the workspace, so absolute ~ paths never round-trip back to $HOME
          path: .jdk-cache
          key: jdk-v3-${{ env.JDK_VERSION }}-linux-x64

      - name: Download JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .jdk-cache
          curl -fsSL -o .jdk-cache/jdk.tar.gz \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-${JDK_VERSION/\+/%2B}/OpenJDK21U-jdk_x64_linux_hotspot_${JDK_VERSION//+/_}.tar.gz"

      - name: Set up JDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.jdk"
          tar -xzf "$GITHUB_WORKSPACE/.jdk-cache/jdk.tar.gz" -C "$GITHUB_WORKSPACE/.jdk" --strip-components=1 --no-same-owner
          echo "JAVA_HOME=$GITHUB_WORKSPACE/.jdk" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.jdk/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.jdk/bin/java" -version

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Verify (unit tests)
        run: ./mvnw -B -ntp verify

      - name: JPMS smoke test
        run: |
          SLF4J=$(find ~/.m2/repository/org/slf4j/slf4j-api -name 'slf4j-api-*.jar' ! -name '*sources*' | sort | tail -1)
          CC=$(find ~/.m2/repository -path '*commons-collections4*' -name 'commons-collections4-*.jar' ! -name '*sources*' | sort | tail -1)
          MP="api/target/classes:core/target/classes:$SLF4J:$CC"
          javac --module-path "$MP" --add-modules devmix.process.acto.core -d "$RUNNER_TEMP/smoke" smoke/ModuleSmoke.java
          java --module-path "$MP" -cp "$RUNNER_TEMP/smoke" --add-modules devmix.process.acto.core ModuleSmoke

      - name: API compatibility (japicmp)
        run: |
          git fetch --no-tags --depth 1 origin "refs/tags/v${JAPICMP_BASELINE}:refs/tags/v${JAPICMP_BASELINE}"
          git worktree add "$RUNNER_TEMP/baseline" "v${JAPICMP_BASELINE}"
          ./mvnw -B -ntp -q -f "$RUNNER_TEMP/baseline/pom.xml" install -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true -pl api,core -am
          ./mvnw -B -ntp -Pjapicmp verify -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true -pl api,core

      - name: Stress tests
        if: success()
        run: >
          ./mvnw -B -ntp test
          -Dtest.excludes=none
          -Dtest=com.github.devmix.process.acto.stress.*Spec
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            api/target/site/spotbugs.html
            core/target/site/spotbugs.html
            core/target/site/jacoco/
          if-no-files-found: warn
