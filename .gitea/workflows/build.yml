name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify (unit tests)
        run: ./mvnw -B -ntp verify

      - name: Stress tests
        if: success()
        run: >
          ./mvnw -B -ntp test
          -Dtest.excludes=none
          -Dtest=com.github.devmix.process.acto.stress.*Spec
          -Dsurefire.failIfNoSpecifiedTests=false
