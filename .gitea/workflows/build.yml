name: build

on:
  push:
    branches: [ main ]
  pull_request:

env:
  # bump manually when a new Temurin 21 build ships
  JDK_VERSION: 21.0.13+9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JDK
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/jdk
          key: jdk-temurin-${{ env.JDK_VERSION }}-linux-x64

      - name: Download JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/jdk
          curl -fsSL -o ~/.cache/jdk/jdk.tar.gz \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-${JDK_VERSION/\+/%2B}/OpenJDK21U-jdk_x64_linux_hotspot_${JDK_VERSION//+/_}.tar.gz"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          jdk-file: /home/runner/.cache/jdk/jdk.tar.gz

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Verify (unit tests)
        run: ./mvnw -B -ntp verify

      - name: Stress tests
        if: success()
        run: >
          ./mvnw -B -ntp test
          -Dtest.excludes=none
          -Dtest=com.github.devmix.process.acto.stress.*Spec
          -Dsurefire.failIfNoSpecifiedTests=false
